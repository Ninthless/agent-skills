interface:
  display_name: "Git Checkpoint Push"
  short_description: "Authorized Git checkpoint actions or message-only drafting"
  default_prompt: "Use $git-checkpoint-push only for an explicit real-repository request to stage, commit, checkpoint, push, create a PR handoff, or draft a message from the current diff. Execute only the named action subset. Use English for commit message prose by default; switch language only when the user explicitly requests another commit-message language. Mere mentions of git, status, diff, branch, or repository, implementation, and ordinary review do not trigger it."

policy:
  allow_implicit_invocation: false
