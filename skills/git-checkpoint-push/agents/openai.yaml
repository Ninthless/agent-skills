interface:
  display_name: "Git Checkpoint Push"
  short_description: "Safe checkpoints with complete Conventional Commits"
  default_prompt: "Use $git-checkpoint-push to inspect, verify, stage, and safely save the completed checkpoint. Build a Conventional Commits 1.0.0 message from the staged diff, including a meaningful body for non-trivial context and valid footer trailers whenever breaking changes, issues, attribution, or signoff apply."

policy:
  allow_implicit_invocation: true
