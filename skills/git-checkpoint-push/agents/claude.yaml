interface:
  display_name: "Git Checkpoint Push"
  short_description: "Safe checkpoints with complete Conventional Commits"
  default_prompt: "Apply the git-checkpoint-push skill: inspect repository and remote state, verify the checkpoint, and stage only relevant files. Write a Conventional Commits 1.0.0 message from the staged diff, with a useful body for non-trivial intent and valid footer trailers for breaking changes, issues, attribution, or required signoff. Push without bypassing repository rules, then report the commit, verification, push result, and remaining changes."

policy:
  allow_implicit_invocation: true
