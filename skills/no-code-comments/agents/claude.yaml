interface:
  display_name: "No Code Comments"
  short_description: "Avoid low-value comments when preferred"
  default_prompt: "Use $no-code-comments only for an explicit comment-free preference, an established repository convention, or as a low-priority companion. User requirements, platform safety, enforced repository rules, and public API documentation contracts take priority. Allow required directives, generated markers, legal headers, useful public docstrings/JSDoc/XML docs, and schema-native description or summary fields. Preserve unrelated existing comments."

policy:
  allow_implicit_invocation: true
