interface:
  display_name: "Xposed Module Dev"
  short_description: "Build, review, and debug Android Xposed/LSPosed modules"
  default_prompt: "Apply the xposed-module-dev skill: first identify whether the project uses the modern libxposed API or the legacy XposedBridge API. Do not mix the two. For new modules prefer modern libxposed. Produce or verify the required registration files, entry class, hook code, and build configuration. Include build, install, enable, and logcat verification steps."

policy:
  allow_implicit_invocation: true
