interface:
  display_name: "Requirement Analysis"
  short_description: "Bound requirements into a testable contract"
  default_prompt: "Use $requirement-analysis when the requested result is a bounded requirement contract, scope analysis, acceptance criteria, or explicit English specification. Separate ER, IR, constraints, preferences, assumptions, conflicts, FR, NFR, dependencies, risks, and handoff. Keep think-in-English normalization internal unless the user requests a visible English spec. Do not implement or invent domain and technical facts."

policy:
  allow_implicit_invocation: true
