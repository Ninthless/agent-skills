interface:
  display_name: "Requirement Analysis"
  short_description: "Bound requirements into a testable contract"
  default_prompt: "Use $requirement-analysis when the deliverable is a bounded requirement contract: clarify or organize scope, resolve ambiguity, write acceptance criteria, FR/NFR, a spec, or a handoff, including webpage requirements without implementation. Keep analysis read-only and hand source implementation to high-constraint-coding. Clear implementation, translation-only, diagnosis, technical choices, API docs, and business-domain research belong elsewhere."

policy:
  allow_implicit_invocation: true
