interface:
  display_name: "Write API Docs"
  short_description: "Create and review evidence-backed API contracts"
  default_prompt: "Use $write-api-docs with group and operation-level authority and mixed implemented, proposed, conflicting, missing, or uncertain status. Honor a requested single format. For review, return findings, Open Questions, and recommendations only without rewriting or writing files. For reconcile, default to differences and defensible fragments unless a full rewrite is authorized. Never invent behavior."

policy:
  allow_implicit_invocation: true
