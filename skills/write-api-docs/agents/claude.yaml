interface:
  display_name: "Write API Docs"
  short_description: "Create concise API docs and integration contracts"
  default_prompt: "Use $write-api-docs when the requested final artifact is an API document, API contract, endpoint reference, OpenAPI/AsyncAPI/GraphQL/proto spec, or frontend/backend API handoff. Match requests such as write, create, generate, update, rewrite, reconcile, review, 接口文档, API文档, 接口契约, 接口对接, 补齐接口文档, or 根据前端/后端证据整理接口. For every request parameter, body, and body field, state required, optional, conditionally required, or unconfirmed; distinguish response presence from nullable and never infer either from one example. Do not use it merely because code mentions an API: endpoint/client/SDK implementation, tests, ordinary source review, bug diagnosis, translation, or API research without a documentation deliverable belong elsewhere. Use repository evidence only; examples never prove required, nullable, format, pattern, default, enum, const, version, or related-field constraints. Emit valid machine-readable artifacts. If security evidence lacks a valid scheme or flow, omit security objects from the artifact and report the observed requirement; never invent OAuth URLs, issuers, scope descriptions, dummy domains, empty flows, malformed security requirements, unresolved refs, or invalid placeholders. Keep the final reference concise and omit analysis reports unless requested."

policy:
  allow_implicit_invocation: true
