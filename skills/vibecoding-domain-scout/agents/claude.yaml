interface:
  display_name: "Vibecoding Domain Scout"
  short_description: "Research unfamiliar domains before building"
  default_prompt: "Use $vibecoding-domain-scout in research-only, product-discovery, or build-handoff mode. Research-only returns sourced domain findings without an MVP or AI Build Brief. Product-discovery adds scope and an MVP only when useful. Only build-handoff produces the AI Build Brief. Separate facts, inferences, assumptions, and validation needs."

policy:
  allow_implicit_invocation: true
