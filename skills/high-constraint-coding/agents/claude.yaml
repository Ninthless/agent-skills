interface:
  display_name: "High-Constraint Coding"
  short_description: "Mandatory guardrails whenever code is produced"
  default_prompt: "Use $high-constraint-coding whenever this task generates, proposes, or modifies code or a code-like artifact, including snippets, scripts, commands, queries, configs, tests, schemas, workflows, and patches. Select proportionate depth, inspect real context when available, preserve contracts and ownership, make the smallest maintainable result, and verify claims honestly."

policy:
  allow_implicit_invocation: true
