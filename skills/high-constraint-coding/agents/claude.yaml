interface:
  display_name: "High-Constraint Coding"
  short_description: "Primary implementation and source-review skill for all coding tasks"
  default_prompt: "Use $high-constraint-coding as the primary skill for explicit coding tasks: write, implement, change, fix, build, test, refactor, or review source code in all programming languages, including frontend, backend, web, scripts, SQL, configs, migrations, and tests. Identify language/version, runtime or compiler, framework, toolchain, repository rules, and local conventions; orient to callers, behavior, state, errors, concurrency, cancellation, resources, invariants, and compatibility. Use the fast path only for trivial low-risk edits. Otherwise choose the owning seam, compare only real options, implement language- and ecosystem-native types, errors, ownership, boundaries, and tests, audit artifacts and complexity, then verify in a fix and rerun loop. Produce maintainable, debuggable, deliberate senior project work; never claim human authorship. For web edits, reuse or start the project-native server, use browser tools when available on the actual page and affected desktop/mobile flow, inspect console and relevant network behavior, capture useful evidence, and fix and rerun only failures introduced by the current change or necessary to complete the explicit request. Report pre-existing or adjacent defects without fixing them unless separately authorized, along with evidence and blockers. Route unknown-cause diagnosis, requirements-only work, current technical research, API docs-only work, translation, and Git actions to their respective skills."

policy:
  allow_implicit_invocation: true
