interface:
  display_name: "High-Constraint Coding"
  short_description: "Minimal verified source changes and reviews"
  default_prompt: "Use $high-constraint-coding for authorized correctness-sensitive source implementation or defect-first source review. Read the real behavior path, keep contracts coherent, mirror maintained local conventions, introduce only intentional artifacts, and verify proportionately. Let bug-diagnosis own unknown causes, requirement-analysis own contracts, technical-solution-research own solution decisions, write-api-docs own documentation deliverables, and git-checkpoint-push own explicit Git actions."

policy:
  allow_implicit_invocation: true
